<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moodle LMS 설정 도우미</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8f7f4;--surface:#ffffff;--surface2:#f2f1ee;--border:#e4e2dc;--border2:#d0cec7;
  --text:#1a1916;--text2:#6b6860;--text3:#9c9a94;
  --accent:#1a56db;--accent-light:#eff4ff;--accent-dark:#1e429f;
  --green:#057a55;--green-light:#def7ec;--amber:#92400e;--amber-light:#fef3c7;
  --red:#9b1c1c;--red-light:#fde8e8;
  --radius:10px;--radius-sm:6px;
  --font:'Noto Sans KR',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;
  --shadow:0 1px 3px rgba(0,0,0,.06);
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
.app{max-width:820px;margin:0 auto;width:100%;padding:20px 16px;flex:1;display:flex;flex-direction:column}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--surface);flex-wrap:wrap}
.logo{width:36px;height:36px;background:var(--accent);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo i{font-size:20px;color:#fff}
.header-text h1{font-size:14px;font-weight:700;color:var(--text)}
.header-text p{font-size:11px;color:var(--text2);margin-top:1px}
.nav{display:flex;gap:3px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:3px;margin-left:auto}
.nav-btn{padding:5px 12px;border-radius:5px;font-size:12px;font-weight:500;border:none;cursor:pointer;background:transparent;color:var(--text2);font-family:var(--font);display:flex;align-items:center;gap:4px;transition:all .15s}
.nav-btn.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.ver-tabs{display:flex;gap:4px}
.ver-btn{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:500;border:1px solid var(--border);cursor:pointer;background:transparent;color:var(--text2);font-family:var(--font);transition:all .15s}
.ver-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.chat-wrap{display:flex;flex-direction:column;height:540px}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msgs::-webkit-scrollbar{width:4px}
.msgs::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
.msg{display:flex;gap:8px}
.msg.user{flex-direction:row-reverse}
.avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;font-size:13px}
.bot .avatar{background:var(--accent-light);color:var(--accent)}
.user .avatar{background:var(--accent);color:#fff}
.bubble{padding:10px 13px;border-radius:14px;font-size:13px;line-height:1.65;max-width:86%}
.bot .bubble{background:var(--surface2);border:1px solid var(--border);border-radius:4px 14px 14px 14px;color:var(--text)}
.user .bubble{background:var(--accent);color:#fff;border-radius:14px 4px 14px 14px}
.result-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 11px;margin-top:7px;font-size:12px}
.rtitle{font-weight:700;color:var(--text);margin-bottom:3px}
.rpath{font-family:var(--mono);font-size:10px;color:var(--accent);background:var(--accent-light);padding:2px 5px;border-radius:3px;display:inline-block;margin-bottom:4px;word-break:break-all}
.ropts{color:var(--text2);font-size:11px;line-height:1.5;white-space:pre-wrap;margin-top:2px}
.rbadge{display:inline-flex;align-items:center;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:700;margin-right:3px}
.req-필수{background:var(--red-light);color:var(--red)}
.req-선택{background:var(--amber-light);color:var(--amber)}
.req-기능안내{background:var(--accent-light);color:var(--accent-dark)}
.src-badge{display:inline-flex;align-items:center;gap:3px;margin-top:5px;padding:2px 7px;border-radius:3px;font-size:10px;font-weight:500}
.src-custom{background:var(--green-light);color:var(--green)}
.src-ai{background:var(--accent-light);color:var(--accent-dark)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.chip{padding:4px 10px;border-radius:20px;font-size:11px;border:1px solid var(--border);cursor:pointer;color:var(--text2);background:var(--surface);font-family:var(--font);transition:all .15s}
.chip:hover{background:var(--surface2);color:var(--text)}
.typing-wrap{display:flex;gap:3px;align-items:center;padding:10px 13px}
.dot{width:5px;height:5px;border-radius:50%;background:var(--text3);animation:blink 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.input-area{padding:10px 12px;border-top:1px solid var(--border);display:flex;gap:7px;align-items:flex-end;background:var(--surface)}
.input-area textarea{flex:1;resize:none;border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 11px;font-size:13px;font-family:var(--font);color:var(--text);background:var(--surface2);line-height:1.5;max-height:90px;outline:none;transition:border-color .15s}
.input-area textarea:focus{border-color:var(--accent);background:var(--surface)}
.send-btn{width:36px;height:36px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.send-btn:hover{background:var(--accent-dark)}
.send-btn:disabled{opacity:.4;cursor:default}
.admin-wrap{display:flex;flex-direction:column;min-height:540px}
.admin-toolbar{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:7px;flex-wrap:wrap;background:var(--surface2)}
.admin-toolbar input,.admin-toolbar select{padding:6px 9px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;font-family:var(--font);background:var(--surface);color:var(--text);outline:none}
.admin-toolbar input{flex:1;min-width:140px}
.admin-toolbar input:focus,.admin-toolbar select:focus{border-color:var(--accent)}
.btn{padding:6px 12px;border-radius:var(--radius-sm);font-size:12px;font-weight:500;border:1px solid var(--border);cursor:pointer;background:var(--surface);color:var(--text);font-family:var(--font);display:inline-flex;align-items:center;gap:4px;transition:all .15s;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-dark)}
.stat-row{padding:7px 14px;border-bottom:1px solid var(--border);display:flex;gap:14px;background:var(--surface);flex-wrap:wrap}
.stat{font-size:11px;color:var(--text2)}
.stat b{color:var(--text);font-weight:700}
.list{padding:10px 14px;display:flex;flex-direction:column;gap:7px;overflow-y:auto;max-height:470px}
.list-item{border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;display:flex;align-items:flex-start;gap:9px;background:var(--surface)}
.list-item:hover{border-color:var(--border2)}
.li-body{flex:1;min-width:0}
.li-meta{display:flex;align-items:center;gap:5px;margin-bottom:3px;flex-wrap:wrap}
.li-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:2px}
.li-path{font-family:var(--mono);font-size:10px;color:var(--accent);background:var(--accent-light);padding:1px 5px;border-radius:3px;display:inline-block;word-break:break-all;margin-bottom:2px}
.li-opts{font-size:11px;color:var(--text2);line-height:1.45;white-space:pre-wrap}
.li-actions{display:flex;gap:4px;flex-shrink:0}
.icon-btn{width:28px;height:28px;border:1px solid var(--border);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;cursor:pointer;background:transparent;color:var(--text2);font-size:14px;transition:all .15s}
.icon-btn:hover{background:var(--surface2)}
.icon-btn.del:hover{background:var(--red-light);color:var(--red);border-color:#fca5a5}
.custom-tag{font-size:10px;background:var(--accent-light);color:var(--accent-dark);padding:1px 5px;border-radius:3px;font-weight:700}
.empty-state{text-align:center;padding:50px 20px;color:var(--text3)}
.empty-state i{font-size:36px;display:block;margin-bottom:8px;opacity:.3}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);width:460px;max-width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-header h2{font-size:14px;font-weight:700;color:var(--text)}
.modal-body{padding:16px}
.field{margin-bottom:12px}
.field label{display:block;font-size:10px;font-weight:700;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
.field input,.field select,.field textarea{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;font-family:var(--font);color:var(--text);background:var(--surface2);outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);background:var(--surface)}
.field textarea{resize:vertical;min-height:80px;line-height:1.5}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-footer{padding:12px 16px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:7px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--text);color:#fff;padding:9px 15px;border-radius:var(--radius-sm);font-size:12px;font-weight:500;z-index:200;transform:translateY(16px);opacity:0;transition:all .25s;pointer-events:none;font-family:var(--font)}
.toast.show{transform:translateY(0);opacity:1}
footer{text-align:center;font-size:11px;color:var(--text3);padding:14px;margin-top:8px}
</style>
</head>
<body>
<div class="app">
  <div class="card">
    <div class="header">
      <div class="logo"><i class="ti ti-school"></i></div>
      <div class="header-text">
        <h1>Moodle LMS 설정 도우미</h1>
        <p>Coursemos LXP 커스텀 설정 + Moodle 기본 기능 안내</p>
      </div>
      <nav class="nav">
        <button class="nav-btn active" id="tab-chat" onclick="switchTab('chat')"><i class="ti ti-message-circle"></i> 챗봇</button>
        <button class="nav-btn" id="tab-admin" onclick="switchTab('admin')"><i class="ti ti-settings"></i> 설정 관리</button>
      </nav>
      <div class="ver-tabs" id="ver-tabs">
        <button class="ver-btn active" onclick="setVer('4.5',this)">v4.5</button>
        <button class="ver-btn" onclick="setVer('3.9',this)">v3.9</button>
        <button class="ver-btn" onclick="setVer('all',this)">전체</button>
      </div>
    </div>
    <div class="chat-wrap" id="chat-panel">
      <div class="msgs" id="msgs">
        <div class="msg bot">
          <div class="avatar"><i class="ti ti-robot"></i></div>
          <div>
            <div class="bubble">
              안녕하세요! Moodle LMS 설정 도우미입니다.<br>
              버전을 선택하고 궁금한 설정을 물어보세요.<br>
              <span style="font-size:11px;color:var(--text3)">커스텀 설정 데이터 + Moodle 기본 지식 통합 답변</span>
            </div>
            <div class="chips">
              <button class="chip" onclick="ask('출석부 설정 방법 알려줘')">출석부 설정</button>
              <button class="chip" onclick="ask('성적부 집계 유형 설정은?')">성적부 설정</button>
              <button class="chip" onclick="ask('동영상 자막 기능 활성화 방법은?')">동영상 설정</button>
              <button class="chip" onclick="ask('강좌 포맷 관리 어떻게 해?')">강좌 포맷</button>
              <button class="chip" onclick="ask('3.9와 4.5 버전 설정 차이 알려줘')">버전 차이</button>
            </div>
          </div>
        </div>
      </div>
      <div class="input-area">
        <textarea id="inp" rows="1" placeholder="설정 경로, 옵션, 버전 차이 등 물어보세요..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="sbtn" onclick="send()"><i class="ti ti-send"></i></button>
      </div>
    </div>
    <div class="admin-wrap" id="admin-panel" style="display:none">
      <div class="admin-toolbar">
        <input type="text" id="srch" placeholder="제목, 카테고리, 경로로 검색..." oninput="renderList()">
        <select id="fver" onchange="renderList()">
          <option value="all">전체 버전</option>
          <option value="4.5">v4.5</option>
          <option value="3.9">v3.9</option>
        </select>
        <select id="fcat" onchange="renderList()">
          <option value="all">전체 카테고리</option>
        </select>
        <button class="btn" onclick="exportCSV()"><i class="ti ti-download"></i> CSV 내보내기</button>
        <button class="btn primary" onclick="openModal()"><i class="ti ti-plus"></i> 항목 추가</button>
      </div>
      <div class="stat-row" id="stat-row"></div>
      <div class="list" id="list"></div>
    </div>
  </div>
  <footer>Coursemos LXP / Moodle 관리자 설정 도우미 · 데이터는 브라우저에 저장됩니다</footer>
</div>
<div class="modal-overlay" id="modal" style="display:none" onclick="closeBg(event)">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-ttl">설정 항목 추가</h2>
      <button class="icon-btn" onclick="closeModal()"><i class="ti ti-x"></i></button>
    </div>
    <div class="modal-body">
      <div class="field-row">
        <div class="field"><label>버전</label><select id="f-v"><option value="4.5">v4.5</option><option value="3.9">v3.9</option></select></div>
        <div class="field"><label>필수 여부</label><select id="f-req"><option value="필수">필수</option><option value="선택">선택</option><option value="기능안내">기능안내</option></select></div>
      </div>
      <div class="field"><label>카테고리</label><input type="text" id="f-cat" placeholder="예: 강의실 설정, 출석 관련..." list="cat-dl"><datalist id="cat-dl"></datalist></div>
      <div class="field"><label>제목</label><input type="text" id="f-title" placeholder="설정 항목 이름"></div>
      <div class="field"><label>경로</label><input type="text" id="f-path" placeholder="/admin/settings.php?section=..."></div>
      <div class="field"><label>내용 / 옵션</label><textarea id="f-opts" placeholder="설정 옵션 내용&#10;(1) 옵션1&#10;(2) 옵션2"></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">취소</button>
      <button class="btn primary" onclick="saveItem()">저장</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'moodle_lms_v4';
const BASE_DATA = JSON.parse(document.getElementById('raw-data').textContent);

let DATA = loadData();
let editingId = null;
let chatVer = '4.5';
let chatHistory = [];

function loadData() {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    if (s) return JSON.parse(s);
  } catch(e) {}
  return BASE_DATA.map((item, i) => ({...item, id: 'b_'+i, isBase: true}));
}
function save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA)); } catch(e) {} }
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}
function switchTab(t) {
  document.getElementById('chat-panel').style.display = t==='chat'?'flex':'none';
  document.getElementById('admin-panel').style.display = t==='admin'?'flex':'none';
  document.getElementById('tab-chat').classList.toggle('active', t==='chat');
  document.getElementById('tab-admin').classList.toggle('active', t==='admin');
  document.getElementById('ver-tabs').style.display = t==='chat'?'flex':'none';
  if (t==='admin') { populateCatFilter(); renderList(); }
}
function setVer(v, el) {
  chatVer = v;
  document.querySelectorAll('.ver-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
}
function searchData(q) {
  const ql = q.toLowerCase();
  return DATA.filter(s => {
    if (chatVer!=='all' && s.v!==chatVer) return false;
    return (s.title||'').toLowerCase().includes(ql)||(s.cat||'').toLowerCase().includes(ql)||
           (s.opts||'').toLowerCase().includes(ql)||(typeof s.path==='string'?s.path:'').toLowerCase().includes(ql);
  }).slice(0,4);
}
function card(item) {
  const p = Array.isArray(item.path)?item.path.join('<br>'):(item.path||'');
  const isUrl = p.startsWith('/')||p.startsWith('http');
  const tag = !item.isBase?'<span class="custom-tag">추가됨</span>':'';
  return `<div class="result-card">
    <div style="display:flex;align-items:center;gap:4px;margin-bottom:3px;flex-wrap:wrap">
      <span class="rbadge req-${item.req}">${item.req}</span>
      <span style="font-size:10px;color:var(--text2)">${item.cat} · v${item.v}</span>${tag}
    </div>
    <div class="rtitle">${item.title}</div>
    ${isUrl?`<div class="rpath">${p}</div>`:`<div style="font-size:11px;color:var(--text2);margin:2px 0">${p}</div>`}
    ${item.opts?`<div class="ropts">${item.opts}</div>`:''}
  </div>`;
}
function addMsg(role, html) {
  const c = document.getElementById('msgs');
  const d = document.createElement('div');
  d.className='msg '+role;
  d.innerHTML=`<div class="avatar"><i class="ti ti-${role==='bot'?'robot':'user'}"></i></div><div>${html}</div>`;
  c.appendChild(d); c.scrollTop=c.scrollHeight;
}
function showTyping() {
  const c=document.getElementById('msgs');
  const d=document.createElement('div');
  d.className='msg bot';d.id='typing';
  d.innerHTML=`<div class="avatar"><i class="ti ti-robot"></i></div><div class="bubble"><div class="typing-wrap"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>`;
  c.appendChild(d);c.scrollTop=c.scrollHeight;
}
function hideTyping(){const el=document.getElementById('typing');if(el)el.remove();}
async function ask(q){document.getElementById('inp').value=q;await send();}
async function send(){
  const inp=document.getElementById('inp');
  const q=inp.value.trim();if(!q)return;
  inp.value='';inp.style.height='auto';
  document.getElementById('sbtn').disabled=true;
  addMsg('user',`<div class="bubble">${q.replace(/</g,'&lt;')}</div>`);
  chatHistory.push({role:'user',content:q});
  const hits=searchData(q);
  let extra='';
  if(hits.length) extra='\n\n[커스텀 설정 데이터 v'+chatVer+']:\n'+
    hits.map(h=>`- [${h.v}] ${h.cat} > ${h.title}\n  경로: ${Array.isArray(h.path)?h.path.join(', '):h.path}\n  내용: ${h.opts||'없음'}\n  필수: ${h.req}`).join('\n');
  showTyping();
  try {
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',max_tokens:1000,
        system:`당신은 Coursemos LXP(Moodle 기반) 관리자 설정 전문가입니다.\n선택 버전: ${chatVer==='all'?'전체(3.9, 4.5)':'v'+chatVer}\n답변 규칙:\n1. 커스텀 설정 데이터가 있으면 우선 활용하여 정확한 경로와 옵션을 안내하세요.\n2. 커스텀 데이터에 없는 Moodle 기본 기능은 일반 지식으로 답변하세요.\n3. 경로는 /admin/... 형식으로 명확히 표시하세요.\n4. 한국어로 친절하고 간결하게 답변하세요.\n5. 커스텀 데이터 기반은 "✅ 커스텀 설정", Moodle 기본은 "📘 Moodle 기본"으로 구분하세요.`,
        messages:[...chatHistory.slice(-6,-1),{role:'user',content:q+extra}]
      })
    });
    const data=await res.json();
    const text=data.content?.find(b=>b.type==='text')?.text||'답변을 가져오지 못했습니다.';
    hideTyping();
    chatHistory.push({role:'assistant',content:text});
    const esc=text.replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
    const cards=hits.length?'<div style="margin-top:7px">'+hits.map(card).join('')+'<span class="src-badge src-custom">📋 커스텀 설정 데이터 기반</span></div>':'<span class="src-badge src-ai" style="margin-top:5px;display:inline-flex">📘 Moodle 기본 지식 기반</span>';
    addMsg('bot',`<div class="bubble">${esc}${cards}</div>`);
  } catch(e) {
    hideTyping();
    addMsg('bot','<div class="bubble">오류가 발생했습니다. 다시 시도해주세요.</div>');
  }
  document.getElementById('sbtn').disabled=false;
  document.getElementById('msgs').scrollTop=9999;
}
function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}}
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,90)+'px';}
function populateCatFilter(){
  const cats=['all',...new Set(DATA.map(d=>d.cat))];
  document.getElementById('fcat').innerHTML=cats.map(c=>`<option value="${c}">${c==='all'?'전체 카테고리':c}</option>`).join('');
}
function renderList(){
  const q=document.getElementById('srch').value.toLowerCase();
  const ver=document.getElementById('fver').value;
  const cat=document.getElementById('fcat').value;
  const filtered=DATA.filter(s=>{
    if(ver!=='all'&&s.v!==ver)return false;
    if(cat!=='all'&&s.cat!==cat)return false;
    return !q||(s.title||'').toLowerCase().includes(q)||(s.cat||'').toLowerCase().includes(q)||
           (s.opts||'').toLowerCase().includes(q)||(typeof s.path==='string'?s.path:'').toLowerCase().includes(q);
  });
  const custom=DATA.filter(d=>!d.isBase);
  document.getElementById('stat-row').innerHTML=
    `<span class="stat">전체 <b>${DATA.length}</b></span><span class="stat">검색결과 <b>${filtered.length}</b></span><span class="stat">사용자 추가 <b style="color:var(--accent)">${custom.length}</b></span>`;
  const wrap=document.getElementById('list');
  if(!filtered.length){wrap.innerHTML='<div class="empty-state"><i class="ti ti-search-off"></i>검색 결과가 없어요</div>';return;}
  wrap.innerHTML=filtered.map(item=>{
    const p=Array.isArray(item.path)?item.path.join(', '):(item.path||'');
    const isUrl=p.startsWith('/')||p.startsWith('http');
    const tag=!item.isBase?'<span class="custom-tag">추가됨</span>':'';
    return `<div class="list-item">
      <div class="li-body">
        <div class="li-meta"><span class="rbadge req-${item.req}">${item.req}</span><span style="font-size:11px;font-weight:700;color:var(--accent)">v${item.v}</span><span style="font-size:11px;color:var(--text2)">${item.cat}</span>${tag}</div>
        <div class="li-title">${item.title}</div>
        ${isUrl?`<div class="li-path">${p}</div>`:`<div style="font-size:11px;color:var(--text2);margin:2px 0">${p}</div>`}
        ${item.opts?`<div class="li-opts">${item.opts}</div>`:''}
      </div>
      <div class="li-actions">
        <button class="icon-btn" onclick="openModal('${item.id}')"><i class="ti ti-edit"></i></button>
        <button class="icon-btn del" onclick="delItem('${item.id}')"><i class="ti ti-trash"></i></button>
      </div>
    </div>`;
  }).join('');
}
function openModal(id){
  editingId=id||null;
  document.getElementById('modal-ttl').textContent=id?'설정 항목 수정':'설정 항목 추가';
  const cats=[...new Set(DATA.map(d=>d.cat))];
  document.getElementById('cat-dl').innerHTML=cats.map(c=>`<option value="${c}">`).join('');
  if(id){
    const it=DATA.find(d=>d.id===id);
    if(it){
      document.getElementById('f-v').value=it.v;
      document.getElementById('f-req').value=it.req;
      document.getElementById('f-cat').value=it.cat||'';
      document.getElementById('f-title').value=it.title||'';
      document.getElementById('f-path').value=Array.isArray(it.path)?it.path.join('\n'):(it.path||'');
      document.getElementById('f-opts').value=it.opts||'';
    }
  } else {
    document.getElementById('f-v').value='4.5';
    document.getElementById('f-req').value='필수';
    ['f-cat','f-title','f-path','f-opts'].forEach(id=>document.getElementById(id).value='');
  }
  document.getElementById('modal').style.display='flex';
}
function closeModal(){document.getElementById('modal').style.display='none';editingId=null;}
function closeBg(e){if(e.target===document.getElementById('modal'))closeModal();}
function saveItem(){
  const title=document.getElementById('f-title').value.trim();
  const cat=document.getElementById('f-cat').value.trim();
  if(!title||!cat){alert('카테고리와 제목은 필수입니다.');return;}
  const item={
    id:editingId||'c_'+Date.now(),
    isBase:editingId?(DATA.find(d=>d.id===editingId)?.isBase||false):false,
    v:document.getElementById('f-v').value,
    req:document.getElementById('f-req').value,
    cat,title,
    path:document.getElementById('f-path').value.trim(),
    opts:document.getElementById('f-opts').value.trim()||null
  };
  if(editingId){const i=DATA.findIndex(d=>d.id===editingId);if(i!==-1)DATA[i]=item;}
  else DATA.unshift(item);
  save();closeModal();populateCatFilter();renderList();
  toast(editingId?'수정되었습니다':'항목이 추가되었습니다');
}
function delItem(id){
  if(!confirm('이 항목을 삭제할까요?'))return;
  DATA=DATA.filter(d=>d.id!==id);save();renderList();
  toast('삭제되었습니다');
}
function exportCSV(){
  const h=['버전','카테고리','제목','경로','내용(옵션)','필수 여부'];
  const rows=DATA.map(d=>[d.v,d.cat,d.title,Array.isArray(d.path)?d.path.join(', '):(d.path||''),d.opts||'',d.req]);
  const csv=[h,...rows].map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}));
  a.download='moodle_settings_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();toast('CSV 다운로드 완료');
}
</script>
</body>
</html>
